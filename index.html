<title>구름몰 백엔드 탐험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* Layout: 위 HUD(할 일·진행도) / 가운데 게임 화면(캔버스 + 대화창 + 활동창이 겹침) / 아래 터치 패드 */
:root{
  --bg:#D5E1EA; --ink:#1B2040; --ink2:#2E3666; --paper:#F7F9FC; --line:#C3D0DC;
  --sun:#FFC83D; --mint:#23A585; --coral:#E8604F; --sky:#3F8FD8; --muted:#56607F;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
#app{max-width:980px;margin:0 auto;padding-block:12px 20px;padding-inline:16px;display:flex;flex-direction:column;gap:10px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0;letter-spacing:.5px;text-wrap:balance}
h1 small{font-size:14px;color:var(--muted);margin-left:6px;letter-spacing:0}
.hbtns{margin-left:auto;display:flex;gap:6px}
.hbtn{font:inherit;font-size:13px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.hbtn:hover{background:var(--sun)}
.hbtn:focus-visible,button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.quest{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 12px}
.quest .lbl{font-family:var(--display);color:var(--sun);font-size:15px;letter-spacing:.6px}
.quest .txt{flex:1;min-width:0}
.pips{display:flex;gap:4px}
.pip{width:22px;height:8px;border-radius:4px;background:#4A5285}
.pip.done{background:var(--mint)}
.pip.now{background:var(--sun)}
#stage{position:relative;height:clamp(340px,64vh,640px);border-radius:14px;overflow:hidden;background:#232948;border:3px solid var(--ink)}
#cv{display:block;width:100%;height:100%;outline:none}
/* 대화창 */
#dlg{position:absolute;left:10px;right:10px;bottom:10px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:12px 14px 12px;box-shadow:0 5px 0 rgba(27,32,64,.35);cursor:pointer;max-height:70%;overflow:auto}
#dlg .sp{display:inline-block;font-family:var(--display);font-size:15px;color:#fff;border-radius:6px;padding:1px 9px;margin-bottom:4px}
#dlg .tx{font-size:16px;line-height:1.6}
#dlg .tx b{background:linear-gradient(transparent 55%,rgba(255,200,61,.75) 55%);font-weight:700}
#dlg .more{position:absolute;right:12px;bottom:6px;font-size:12px;color:var(--muted)}
#dlg .opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.opt{font:inherit;text-align:left;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer}
.opt:hover{background:#FFF3CF}
.opt.wrong{background:#FBE0DC;border-color:var(--coral);color:#8A2A1F}
.opt.right{background:#D6F3EA;border-color:var(--mint)}
.opt:disabled{cursor:default}
.fb{min-height:1.4em;margin:6px 0 0;font-size:14px}
.fb.ok{color:#137A60}.fb.no{color:#B3392A}
/* 토스트 */
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--sun);color:var(--ink);font-family:var(--display);font-size:15px;padding:5px 14px;border-radius:20px;border:2px solid var(--ink);white-space:nowrap;transition:opacity .3s}
/* 활동창 */
#modal{position:absolute;inset:0;background:rgba(20,24,50,.62);display:flex;align-items:center;justify-content:center;padding:12px}
#modal .panel{background:var(--paper);border:3px solid var(--ink);border-radius:14px;width:100%;max-width:640px;max-height:100%;overflow:auto;padding:16px 18px}
#modal h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 2px}
#modal .sub{color:var(--muted);margin:0 0 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:#E8EEF6;border-radius:6px;padding:3px 8px;font-size:13px}
.chip b{font-family:ui-monospace,Menlo,monospace}
.cust{display:flex;align-items:center;gap:12px;background:#fff;border:2px dashed var(--line);border-radius:10px;padding:12px;margin-bottom:10px;min-height:64px}
.who{font-family:var(--display);font-size:18px;min-width:3.2em}
.bubble{background:#EEF3F8;border-radius:10px;padding:6px 10px;flex:1;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row .opt{flex:1 1 150px;text-align:center}
.primary{font-family:var(--display);font-size:17px;border:3px solid var(--ink);background:var(--sun);color:var(--ink);border-radius:10px;padding:8px 18px;cursor:pointer;margin-top:12px}
.primary:hover{filter:brightness(1.05)}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctr{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:8px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.ctr:hover{background:#FFF3CF}
.ctr .nm{font-family:var(--display);font-size:16px}
.dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:40px;align-content:flex-start;margin-top:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--coral)}
.steps{display:flex;flex-direction:column;gap:6px}
.picked{counter-reset:s;display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-height:30px;border-left:3px solid var(--mint);padding-left:10px}
.picked div{counter-increment:s;font-size:14px}
.picked div::before{content:counter(s) ". ";font-weight:700;color:var(--mint)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .25s 2}
.tpl{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--ink);color:#E8ECFF;border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.tpl .v{color:var(--sun)}
table.ctx{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.ctx th,table.ctx td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
table.ctx th{font-family:var(--display);font-weight:400;color:var(--muted)}
table.ctx select{font:inherit;font-size:14px;padding:2px 4px}
.tw{overflow-x:auto}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.kit .opt.on{background:#D6F3EA;border-color:var(--mint)}
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:10px}
.city{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.bar{height:6px;background:#E3E9F0;border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mint);transition:width 1.6s ease}
.big{font-family:var(--display);font-size:32px;font-variant-numeric:tabular-nums}
.log{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#10142C;color:#9BE3C9;border-radius:8px;padding:8px 10px;min-height:60px;max-height:120px;overflow:auto;margin-top:10px}
.note{background:#FFF3CF;border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.opt.sel{background:#FFE9A8}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 12px}
.node{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:4px 8px;font-size:13px;line-height:1.35}
.node em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.arr{color:var(--muted);font-weight:700}
.flowlbl{font-family:var(--display);font-size:16px;margin-top:6px}
.cert{border:3px double var(--ink);border-radius:12px;padding:14px;text-align:center;background:#FFFBEF;margin-top:10px}
.cert .t{font-family:var(--display);font-size:26px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.gcard{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.gcard .n{font-family:var(--display);font-size:18px}
.gcard .m{font-size:13px;color:var(--coral)}
.gcard .r{font-size:13px;margin-top:2px}
.gcard .v{font-size:12px;color:var(--muted);margin-top:3px}
/* 타이틀 */
#title{position:absolute;inset:0;background:#232948;color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
#title .big1{font-family:var(--display);font-size:clamp(34px,7vw,56px);color:var(--sun);line-height:1.1}
#title p{max-width:34em;margin:0;color:#C9D1F0}
#title .keys{font-size:13px;color:#9AA4CF}
#title kbd{background:#3A4274;border-radius:4px;padding:1px 6px;font-family:inherit;color:#fff}
/* 터치 패드 */
#pad{display:none;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
@media (pointer:coarse){#pad{display:flex}}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.pb{border:3px solid var(--ink);background:var(--paper);border-radius:12px;font-size:20px;color:var(--ink);touch-action:none}
.pb:active,.pb.hold{background:var(--sun)}
.abtn{width:84px;height:84px;border-radius:50%;font-family:var(--display);font-size:24px}
.foot{font-size:12px;color:var(--muted)}
.foot a{color:var(--ink2)}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar i{transition:none}}
</style>

<div id="app">
  <header>
    <h1>구름몰 백엔드 탐험 <small>수습 매니저 온보딩</small></h1>
    <div class="hbtns">
      <button class="hbtn" id="bGloss" type="button">도감 (T)</button>
      <button class="hbtn" id="bReset" type="button">처음부터</button>
    </div>
  </header>
  <div class="quest">
    <span class="lbl">지금 할 일</span>
    <span class="txt" id="qtxt">…</span>
    <span class="pips" id="pips"></span>
  </div>
  <div id="stage">
    <canvas id="cv" tabindex="0" aria-label="쇼핑몰 지도. 방향키로 움직이고 스페이스로 대화"></canvas>
    <div id="dlg" hidden></div>
    <div id="toast" hidden></div>
    <div id="modal" hidden><div class="panel"><h2 id="mTitle"></h2><p class="sub" id="mSub"></p><div id="mBody"></div></div></div>
    <div id="title">
      <div class="big1">구름몰 백엔드 탐험</div>
      <p>아틀라시안에서 해고된 엔지니어가 공개한 40분짜리 시스템 강의를 쇼핑몰 하나로 바꿨어요. 신입 매니저가 되어 매장 사람들을 만나면서 백엔드를 배워 봐요.</p>
      <p class="keys"><kbd>←↑↓→</kbd> 또는 <kbd>WASD</kbd>로 이동 · <kbd>Space</kbd>로 대화·넘기기 · <kbd>T</kbd> 도감</p>
      <button class="primary" id="bStart" type="button">시작하기</button>
    </div>
  </div>
  <div id="pad">
    <div class="dpad">
      <span></span><button class="pb" data-k="up" type="button" aria-label="위">▲</button><span></span>
      <button class="pb" data-k="left" type="button" aria-label="왼쪽">◀</button><span></span><button class="pb" data-k="right" type="button" aria-label="오른쪽">▶</button>
      <span></span><button class="pb" data-k="down" type="button" aria-label="아래">▼</button><span></span>
    </div>
    <button class="pb abtn" id="bA" type="button">대화</button>
  </div>
  <p class="foot">원본 영상: <a href="https://www.youtube.com/watch?v=55pTFVoclvE" target="_blank" rel="noopener">I was laid off by Atlassian (Vasilios Syrakis, 2026)</a> · 게임 속 인물과 매장은 비유를 위해 지어낸 것이에요.</p>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cvs=$('#cv'),ctx=cvs.getContext('2d'),stage=$('#stage');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── 지도 ───────── */
const MW=32,MH=22;
const G=[...Array(MH)].map(()=>Array(MW).fill('.'));
function wr(x0,y0,x1,y1){for(let x=x0;x<=x1;x++){G[y0][x]='#';G[y1][x]='#'}for(let y=y0;y<=y1;y++){G[y][x0]='#';G[y][x1]='#'}}
function door(...ps){ps.forEach(([x,y])=>G[y][x]='D')}
wr(0,0,MW-1,MH-1);
wr(0,0,7,8);door([3,8],[4,8]);
wr(7,0,13,6);door([10,6],[11,6]);
wr(13,0,19,6);door([16,6],[17,6]);
wr(19,0,25,6);door([22,6],[23,6]);
wr(25,0,31,8);door([27,8],[28,8]);
wr(0,10,8,18);door([8,13],[8,14]);
wr(23,10,31,18);door([23,13],[23,14]);
for(let x=14;x<=17;x++)G[21][x]='x';

const ZONES=[
  {x0:1,y0:1,x1:6,y1:7,c:['#DCD6EA','#D2CBE3'],name:'기계실'},
  {x0:8,y0:1,x1:12,y1:5,c:['#FBE6C6','#F5DBB4'],name:'할일 문구점'},
  {x0:14,y0:1,x1:18,y1:5,c:['#D6EEDD','#C9E6D1'],name:'위키 서점'},
  {x0:20,y0:1,x1:24,y1:5,c:['#DBE2F6','#CED7F1'],name:'코드 창고'},
  {x0:26,y0:1,x1:30,y1:7,c:['#D3E5F2','#C6DCEC'],name:'설계실'},
  {x0:1,y0:11,x1:7,y1:17,c:['#F6DAD4','#EFCDC6'],name:'입점 신청 창구'},
  {x0:24,y0:11,x1:30,y1:17,c:['#D1D8E8','#C4CDE0'],name:'관제실'},
];
function zoneAt(x,y){return ZONES.find(z=>x>=z.x0&&x<=z.x1&&y>=z.y0&&y<=z.y1)}

const F=[];
function furn(x,y,w,h,kind,o={}){F.push({x,y,w,h,kind,...o});if(!o.walk)for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)G[j][i]='f'}
furn(9,3,3,1,'counter',{c:'#D89A4E'});furn(15,3,3,1,'counter',{c:'#56AE78'});furn(21,3,3,1,'counter',{c:'#6E86D4'});
[[8,1],[12,1],[14,1],[18,1],[20,1],[24,1]].forEach(([x,y])=>furn(x,y,1,1,'shelf'));
furn(1,1,3,2,'machine');furn(6,1,1,2,'pipes');
furn(27,2,3,2,'blueprint');
furn(2,13,3,1,'counter',{c:'#D9534F',label:'창구'});furn(6,11,1,1,'queuebox');furn(1,16,2,1,'ledger');furn(5,16,1,1,'robot');
furn(25,11,5,1,'monitors');furn(26,15,3,1,'console');
furn(13,9,6,1,'desk');
furn(13,13,6,2,'stage',{walk:true});
furn(10,19,4,1,'gate');furn(18,19,4,1,'gate');
furn(9,9,1,1,'plant');furn(22,9,1,1,'plant');furn(1,20,1,1,'plant');furn(30,20,1,1,'plant');

const NPCS=[
  {id:'minji',x:9.5,y:15.5,name:'손님 민지',color:'#E8604F',ch:0},
  {id:'keeper1',x:10.5,y:2.3,name:'문구점 사장',color:'#D08A3C'},
  {id:'keeper2',x:16.5,y:2.3,name:'서점 사장',color:'#3E9E66'},
  {id:'keeper3',x:22.5,y:2.3,name:'창고 사장',color:'#5A72C8'},
  {id:'envoy',x:15.5,y:8.3,name:'안내원 엔보이',color:'#3F8FD8',ch:1},
  {id:'broker',x:3.5,y:12.2,name:'창구 직원 브로',color:'#C9443F',ch:2},
  {id:'sov',x:27.5,y:12.6,name:'관제실장 소버린',color:'#6B5BD2',ch:3},
  {id:'arch',x:28.5,y:5.5,name:'설계 팀장',color:'#2A86AE',ch:4},
  {id:'guard',x:12.5,y:17.6,name:'경비대장',color:'#34466B',ch:5},
  {id:'mech',x:3.5,y:4.6,name:'정비사 할머니',color:'#8E6FB5',ch:6},
  {id:'senior',x:15.5,y:13.7,name:'구름 선배',color:'#23A585',ch:7},
];
const npcTile=new Set(NPCS.map(n=>`${Math.floor(n.x)},${Math.floor(n.y)}`));
const SPK={'구름 선배':'#23A585','안내':'#56607F'};NPCS.forEach(n=>SPK[n.name]=n.color);

/* ───────── 저장 상태 ───────── */
const KEY='gureum-mall-v1';
let S={prog:0,c0:0,terms:[],x:15.5,y:20.3};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d)S={...S,...d}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({...S,x:P.x,y:P.y}))}catch(e){}}
load();
const P={x:S.x,y:S.y,dir:'up',moving:false,t:0};

/* ───────── 용어 도감 ───────── */
const TERMS={
 client:['클라이언트','손님 민지','요청을 보내는 쪽. 내 폰 앱, 웹 브라우저.',''],
 server:['서버','매장','요청을 받아 응답을 돌려주는 컴퓨터나 프로그램.',''],
 reqres:['요청 · 응답','쪽지와 봉투','클라이언트가 보내는 부탁(요청)과 서버가 돌려주는 결과(응답).',''],
 backend:['백엔드','손님 눈에 안 보이는 매장 안쪽','화면 뒤에서 데이터를 처리하고 저장하는 부분. 손님이 보는 쪽은 프론트엔드.',''],
 proxy:['프록시','안내원','클라이언트와 서버 사이에서 요청을 대신 전달하는 중간 프로그램.','09:59'],
 routing:['라우팅','어느 매장으로 보낼지 정하기','요청의 주소 등을 보고 목적지를 고르는 규칙.','23:13'],
 lb:['로드밸런서','계산대마다 손님 나눠 주기','여러 서버에 요청을 골고루 나눠서 한곳이 터지지 않게 한다.','09:59'],
 envoy:['Envoy','안내원 엔보이','Lyft가 만든 오픈소스 프록시. 실행 중에 설정을 바꿀 수 있다.','10:26'],
 dynamic:['동적 설정','일하면서 지침서 갈아 끼우기','재시작 없이 실행 중에 설정을 바꾸는 것.','11:02'],

const keys={up:false,down:false,left:false,right:false};
const KMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
let started=false,busy=false,advance=null,optKeys=null;
addEventListener('keydown',e=>{
  if(!started) return;
  if(!$('#modal').hidden){ if(e.code==='Escape'&&glossOpen) closeGloss(); return; }
  if(e.code==='KeyT'){e.preventDefault();openGloss();return}
  if(busy){
    if(optKeys&&/^Digit[1-9]$/.test(e.code)){e.preventDefault();optKeys(+e.code.slice(5)-1);return}
    if(['Space','Enter','KeyE'].includes(e.code)){e.preventDefault();advance&&advance();}
    return;
  }
  if(KMAP[e.code]){e.preventDefault();keys[KMAP[e.code]]=true}
  if(['Space','Enter','KeyE'].includes(e.code)){e.preventDefault();tryInteract()}
});
addEventListener('keyup',e=>{if(KMAP[e.code])keys[KMAP[e.code]]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.querySelectorAll('.pb[data-k]').forEach(b=>{
  const k=b.dataset.k,on=e=>{e.preventDefault();keys[k]=true;b.classList.add('hold')},off=()=>{keys[k]=false;b.classList.remove('hold')};
  b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,off));
});
$('#bA').addEventListener('click',()=>{if(!started||!$('#modal').hidden)return;if(busy){advance&&advance()}else tryInteract()});

/* ───────── 이동과 충돌 ───────── */
function solid(tx,ty){
  if(tx<0||ty<0||tx>=MW||ty>=MH) return true;
  const t=G[ty][tx];
  return t==='#'||t==='f'||t==='x'||npcTile.has(`${tx},${ty}`);
}
const HB=0.3;
function blocked(x,y){
  return solid(Math.floor(x-HB),Math.floor(y-HB))||solid(Math.floor(x+HB),Math.floor(y-HB))||solid(Math.floor(x-HB),Math.floor(y+HB))||solid(Math.floor(x+HB),Math.floor(y+HB));
}
function update(dt){
  if(busy||!started||!$('#modal').hidden){P.moving=false;return}
  let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);
  P.moving=!!(dx||dy);
  if(!P.moving) return;
  if(dx&&dy){dx*=.7071;dy*=.7071}
  if(Math.abs(dx)>Math.abs(dy)) P.dir=dx>0?'right':'left'; else P.dir=dy>0?'down':'up';
  const sp=4.4*dt;
  if(!blocked(P.x+dx*sp,P.y)) P.x+=dx*sp;
  if(!blocked(P.x,P.y+dy*sp)) P.y+=dy*sp;
  P.t+=dt;
}
function nearNPC(){
  let best=null,bd=2.45;
  for(const n of NPCS){const d=Math.hypot(n.x-P.x,n.y-P.y);if(d<bd){bd=d;best=n}}
  return best;
}

function hideDlg(){dlg.hidden=true;dlg.onclick=null;advance=null;optKeys=null}
let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.hidden=true,300)},2200)}
function addTerms(ks){
  const nw=ks.filter(k=>!S.terms.includes(k));
  if(!nw.length) return;
  S.terms.push(...nw);save();
  toast(`도감에 새 단어 ${nw.length}개: ${nw.map(k=>TERMS[k][0]).join(', ')}`);
}
async function runScript(steps){
  busy=true;
  for(const st of steps){
    if(st.s) await say(st.s,st.t);
    else if(st.quiz) await quiz(st.quiz);
    else if(st.act){hideDlg();await ACTS[st.act]()}
    else if(st.term) addTerms(st.term);
  }
  hideDlg();busy=false;
  for(const k in keys)keys[k]=false;
}

async function tryInteract(){
  const n=nearNPC();if(!n)return;
  if(n.id==='keeper1'&&S.prog===0&&S.c0===1){await runScript(C0_KEEPER);S.c0=2;save();hud();return}
  if(n.ch===undefined){await runScript([{s:n.name,t:FLAVOR[n.id]}]);return}
  if(n.ch===0&&S.prog===0){
    if(S.c0===0){await runScript(C0_START);S.c0=1;save();hud();return}
    if(S.c0===1){await runScript([{s:n.name,t:'위쪽 할일 문구점 사장님한테 쪽지 보여 주면 돼요!'}]);return}
    await finishChapter(0);return;
  }
  if(n.ch===S.prog){await finishChapter(n.ch);return}
  if(n.ch>S.prog){await runScript([{s:n.name,t:`지금은 좀 바빠요. 먼저 "${objective()[0]}"부터 해 보세요!`}]);return}
  // 이미 끝낸 챕터: 복습
  busy=true;
  const again=await new Promise(res=>{
    dlg.hidden=false;dlg.onclick=null;advance=null;
    dlg.innerHTML=`<span class="sp" style="background:${n.color}">${n.name}</span><div class="tx">${n.ch}강 "${CH_LABEL[n.ch]}"은 이미 끝냈어요. 다시 들을래요?</div><div class="opts"><button class="opt" type="button">1. 처음부터 다시 듣기</button><button class="opt" type="button">2. 괜찮아요</button></div>`;
    const bs=dlg.querySelectorAll('.opt');
    bs[0].onclick=e=>{e.stopPropagation();res(true)};bs[1].onclick=e=>{e.stopPropagation();res(false)};
    optKeys=i=>{if(i<2)res(i===0)};
  });
  hideDlg();busy=false;
  if(again) await runScript(CH[n.ch]);
}
async function finishChapter(ch){
  await runScript(CH[ch]);
  if(S.prog===ch){S.prog=ch+1;save();hud();toast(ch===7?'졸업 완료!':`${ch}강 "${CH_LABEL[ch]}" 완료!`)}
}

      if(k===v.a){q('.log').innerHTML+=`[10:${String(i*7+3).padStart(2,'0')}] ${v.who} → ${logTxt[k]}<br>`;q('.log').scrollTop=1e4;q('.fb').className='fb ok';q('.fb').textContent='정확해!';i++;setTimeout(show,450)}
      else{bt.classList.add('wrong');q('.fb').className='fb no';q('.fb').textContent=hints[v.a]}
    });
  }
  show();
});

  const got=Object.keys(TERMS).filter(k=>S.terms.includes(k));
  b.innerHTML=(got.length?`<div class="gloss">${got.map(k=>{const t=TERMS[k];return `<div class="gcard"><div class="n">${t[0]}</div><div class="m">쇼핑몰: ${t[1]}</div><div class="r">${t[2]}</div>${t[3]?`<div class="v">영상 ${t[3]}</div>`:''}</div>`}).join('')}</div>`:'<p>아직 모은 단어가 없어. NPC들과 대화하면 채워져.</p>');

/* ───────── 그리기 ───────── */
let DPR=1,cw=0,chh=0,T=32;
function resize(){const r=stage.getBoundingClientRect();DPR=window.devicePixelRatio||1;cw=r.width;chh=r.height;cvs.width=Math.round(cw*DPR);cvs.height=Math.round(chh*DPR);T=Math.round(Math.max(26,Math.min(46,Math.min(cw/15,chh/10.5))))}
new ResizeObserver(resize).observe(stage);resize();

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function label(txt,x,y,size,col,bg){
  ctx.font=`${size}px "Do Hyeon", "Apple SD Gothic Neo", sans-serif`;
  const w=ctx.measureText(txt).width+size*.9,h=size*1.45;
  if(bg){ctx.fillStyle=bg;rr(x-w/2,y-h/2,w,h,h/2.6);ctx.fill()}
  ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y+1);
}
function drawFurn(f){
  const x=f.x*T,y=f.y*T,w=f.w*T,h=f.h*T,p=T*.08;
  switch(f.kind){
    case 'counter':
      ctx.fillStyle=f.c;rr(x+p,y+p,w-2*p,h-2*p,6);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.35)';rr(x+p,y+p,w-2*p,h*.3,6);ctx.fill();
      if(f.label)label(f.label,x+w/2,y+h*.6,T*.34,'#fff');break;
    case 'shelf':
      ctx.fillStyle='#8A5A3B';ctx.fillRect(x+p,y+p,w-2*p,h-2*p);
      ['#E8604F','#3F8FD8','#FFC83D','#23A585'].forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(x+p*2+i*(w-4*p)/4,y+h*.2,(w-4*p)/4-2,h*.55)});break;
    case 'desk':
      ctx.fillStyle='#2D6FB0';rr(x,y+p,w,h-p,10);ctx.fill();
      ctx.fillStyle='#5FA3E6';rr(x,y+p,w,h*.35,10);ctx.fill();
      label('안내데스크',x+w/2,y+h*.62,T*.38,'#fff');break;
    case 'machine':
      ctx.fillStyle='#6D6A80';rr(x+p,y+p,w-2*p,h-2*p,8);ctx.fill();
      ctx.strokeStyle='#C9C4DA';ctx.lineWidth=3;
      [[.3,.4],[.62,.6]].forEach(([a,c])=>{ctx.beginPath();ctx.arc(x+w*a,y+h*c,T*.35,0,Math.PI*2);ctx.stroke()});
      break;
    case 'pipes':
      ctx.fillStyle='#8F8AA6';ctx.fillRect(x+w*.3,y,w*.4,h);ctx.fillStyle='#B0ABC6';ctx.fillRect(x+w*.3,y+h*.3,w*.4,h*.08);break;
    case 'blueprint':
      ctx.fillStyle='#255E91';rr(x+p,y+p,w-2*p,h-2*p,6);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1;
      for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(x+w*i/6,y+p*2);ctx.lineTo(x+w*i/6,y+h-p*2);ctx.stroke()}
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(x+w*.25,y+h*.3,w*.3,h*.4);
      label('설계도',x+w*.72,y+h*.5,T*.3,'#fff');break;
    case 'queuebox':
      ctx.fillStyle='#E8A93A';rr(x+p,y+p*2,w-2*p,h-3*p,5);ctx.fill();
      ctx.fillStyle='#1B2040';ctx.fillRect(x+w*.25,y+h*.35,w*.5,h*.08);
      label('대기함',x+w/2,y+h*1.05,T*.26,'#1B2040','rgba(255,255,255,.8)');break;
    case 'ledger':
      ctx.fillStyle='#6A4A33';ctx.fillRect(x+p,y+p,w-2*p,h-2*p);
      for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#F2E6CF':'#E4D3B3';ctx.fillRect(x+p*2+i*(w-4*p)/6,y+h*.2,(w-4*p)/6-2,h*.6)}
      label('장부 (DB)',x+w/2,y-h*.18,T*.26,'#1B2040','rgba(255,255,255,.8)');break;
    case 'robot':{
      const cx=x+w/2,cy=y+h/2;
      ctx.fillStyle='#9AA6BF';rr(cx-T*.3,cy-T*.2,T*.6,T*.5,6);ctx.fill();
      ctx.fillStyle='#C8D1E3';rr(cx-T*.25,cy-T*.45,T*.5,T*.3,6);ctx.fill();
      ctx.fillStyle='#23A585';ctx.fillRect(cx-T*.13,cy-T*.35,T*.07,T*.07);ctx.fillRect(cx+T*.06,cy-T*.35,T*.07,T*.07);
      ctx.strokeStyle='#9AA6BF';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy-T*.45);ctx.lineTo(cx,cy-T*.58);ctx.stroke();
      label('워커',cx,y+h*1.05,T*.26,'#1B2040','rgba(255,255,255,.8)');break;}
    case 'monitors':
      for(let i=0;i<f.w;i++){const mx=x+i*T;ctx.fillStyle='#1B2040';rr(mx+p,y+p,T-2*p,h-2*p,4);ctx.fill();
        ctx.strokeStyle='#5FE0B2';ctx.lineWidth=1.5;ctx.beginPath();for(let k=0;k<6;k++){const px=mx+p*2+k*(T-4*p)/5,py=y+h*.5+Math.sin(k*1.7+i+perf/600)*h*.18;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke()}
      break;
    case 'console':
      ctx.fillStyle='#5A6488';rr(x+p,y+p,w-2*p,h-2*p,6);ctx.fill();
      ['#FFC83D','#E8604F','#23A585','#3F8FD8','#FFC83D'].forEach((c,i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+w*(i+1)/6,y+h/2,T*.08,0,Math.PI*2);ctx.fill()});break;
    case 'stage':
      ctx.fillStyle='#C99A62';rr(x,y,w,h,10);ctx.fill();ctx.fillStyle='#E0B57E';rr(x+p,y+p,w-2*p,h*.4,8);ctx.fill();
      label('졸업 무대',x+w/2,y+h*.78,T*.3,'#5A3B1C');break;
    case 'gate':
      for(let i=0;i<f.w;i++){const gx=x+i*T;ctx.fillStyle='#8C95AE';ctx.fillRect(gx+T*.15,y+T*.2,T*.2,T*.6);ctx.fillStyle='#E8604F';ctx.fillRect(gx+T*.35,y+T*.42,T*.55,T*.12)}
      break;
    case 'plant':
      ctx.fillStyle='#A8683F';rr(x+T*.28,y+T*.55,T*.44,T*.35,4);ctx.fill();
      ctx.fillStyle='#2F9E6A';ctx.beginPath();ctx.arc(x+T*.5,y+T*.42,T*.3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#46B884';ctx.beginPath();ctx.arc(x+T*.4,y+T*.34,T*.14,0,Math.PI*2);ctx.fill();break;
  }
}
function markerFor(n){
  if(S.prog===0){
    if(n.id==='minji') return S.c0===1?null:'!';
    if(n.id==='keeper1'&&S.c0===1) return '!';
  }
  if(n.ch===undefined) return null;
  if(n.ch<S.prog) return 'done';
  if(n.ch===S.prog&&n.ch!==0) return '!';
  return null;
}
function drawNPC(n,t){
  const x=n.x*T,y=n.y*T;
  ctx.fillStyle='rgba(20,24,50,.18)';ctx.beginPath();ctx.ellipse(x,y+T*.34,T*.3,T*.1,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=n.color;rr(x-T*.26,y-T*.06,T*.52,T*.42,T*.18);ctx.fill();
  ctx.fillStyle='#F6D2B8';ctx.beginPath();ctx.arc(x,y-T*.2,T*.22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(x,y-T*.28,T*.22,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1B2040';ctx.fillRect(x-T*.1,y-T*.2,T*.05,T*.06);ctx.fillRect(x+T*.05,y-T*.2,T*.05,T*.06);
  label(n.name,x,y+T*.58,Math.max(11,T*.27),'#fff','rgba(27,32,64,.78)');
  const m=markerFor(n);
  if(m==='!'){
    const by=y-T*.78+(RM?0:Math.sin(t/220)*T*.07);
    ctx.fillStyle='#FFC83D';ctx.strokeStyle='#1B2040';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,by,T*.2,0,Math.PI*2);ctx.fill();ctx.stroke();
    label('!',x,by,T*.3,'#1B2040');
  }else if(m==='done'){
    ctx.fillStyle='#23A585';ctx.beginPath();ctx.arc(x+T*.28,y-T*.42,T*.13,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+T*.22,y-T*.42);ctx.lineTo(x+T*.27,y-T*.36);ctx.lineTo(x+T*.35,y-T*.48);ctx.stroke();
  }
}
function drawPlayer(t){
  const bob=P.moving&&!RM?Math.abs(Math.sin(P.t*12))*T*.06:0;
  const x=P.x*T,y=P.y*T-bob;
  ctx.fillStyle='rgba(20,24,50,.22)';ctx.beginPath();ctx.ellipse(P.x*T,P.y*T+T*.34,T*.3,T*.1,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1B2040';rr(x-T*.27,y-T*.06,T*.54,T*.42,T*.18);ctx.fill();
  ctx.fillStyle='#FFC83D';ctx.fillRect(x-T*.05,y-T*.02,T*.1,T*.3);
  ctx.fillStyle='#F6D2B8';ctx.beginPath();ctx.arc(x,y-T*.2,T*.22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFC83D';ctx.beginPath();ctx.arc(x,y-T*.27,T*.23,Math.PI,Math.PI*2);ctx.fill();
  const off={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[P.dir];
  ctx.fillRect(x+off[0]*T*.14-T*.12,y-T*.3+(P.dir==='up'?-T*.02:0),T*.24,T*.05);
  if(P.dir!=='up'){ctx.fillStyle='#1B2040';const ex=off[0]*T*.06;ctx.fillRect(x+ex-T*.1,y-T*.2,T*.05,T*.06);ctx.fillRect(x+ex+T*.05,y-T*.2,T*.05,T*.06)}
  label('나',x,y+T*.58,Math.max(11,T*.27),'#1B2040','#FFC83D');
}
let perf=0;
function draw(t){
  perf=t;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#232948';ctx.fillRect(0,0,cw,chh);
  const vw=cw/T,vh=chh/T;
  const camX=MW<=vw?(MW-vw)/2:Math.max(0,Math.min(MW-vw,P.x-vw/2));
  const camY=MH<=vh?(MH-vh)/2:Math.max(0,Math.min(MH-vh,P.y-vh/2));
  ctx.save();ctx.translate(Math.round(-camX*T),Math.round(-camY*T));
  const x0=Math.max(0,Math.floor(camX)),x1=Math.min(MW-1,Math.ceil(camX+vw)),y0=Math.max(0,Math.floor(camY)),y1=Math.min(MH-1,Math.ceil(camY+vh));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const g=G[y][x],px=x*T,py=y*T;
    if(g==='#'){ctx.fillStyle='#39406A';ctx.fillRect(px,py,T,T);ctx.fillStyle='#4D5690';ctx.fillRect(px,py,T,T*.22);continue}
    if(g==='x'){ctx.fillStyle='#EEF2F5';ctx.fillRect(px,py,T,T);ctx.fillStyle='#9FD3F0';ctx.fillRect(px+2,py+T*.2,T-4,T*.7);ctx.fillStyle='#39406A';ctx.fillRect(px,py+T*.85,T,T*.15);continue}
    const z=g==='D'?null:zoneAt(x,y);
    const c=z?z.c:['#EEF2F5','#E3E9EF'];
    ctx.fillStyle=c[(x+y)&1];ctx.fillRect(px,py,T,T);
  }
  // 입구 매트
  ctx.fillStyle='#C9D6E2';ctx.fillRect(14*T,20*T,4*T,T);
  label('정문',16*T,20.5*T,T*.32,'#39406A');
  F.forEach(drawFurn);
  ZONES.forEach(z=>{if(z.name==='기계실'||z.name==='설계실')label(z.name,(z.x0+z.x1+1)/2*T,(z.y1+.55)*T,T*.32,'#fff','rgba(27,32,64,.7)');else label(z.name,(z.x0+z.x1+1)/2*T,(z.y1+.55)*T,T*.32,'#fff','rgba(27,32,64,.7)')});
  label('광장',16*T,17*T,T*.3,'rgba(57,64,106,.45)');
  const ents=[...NPCS.map(n=>({y:n.y,f:()=>drawNPC(n,t)})),{y:P.y,f:()=>drawPlayer(t)}].sort((a,b)=>a.y-b.y);
  ents.forEach(e=>e.f());
  // 목표 화살표
  const tg=objective()[1];
  if(tg&&!busy){const n=NPCS.find(v=>v.id===tg),d=Math.hypot(n.x-P.x,n.y-P.y);
    if(d>2.6){const a=Math.atan2(n.y-P.y,n.x-P.x),r=T*1.05+(RM?0:Math.sin(t/200)*T*.08),ax=P.x*T+Math.cos(a)*r,ay=P.y*T+Math.sin(a)*r;
      ctx.save();ctx.translate(ax,ay);ctx.rotate(a);ctx.fillStyle='#FFC83D';ctx.strokeStyle='#1B2040';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(T*.26,0);ctx.lineTo(-T*.12,-T*.18);ctx.lineTo(-T*.12,T*.18);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}}
  // 대화 힌트
  const nn=!busy&&started&&modal.hidden?nearNPC():null;
  if(nn) label(matchMedia('(pointer:coarse)').matches?'대화 버튼':'Space 대화',nn.x*T,nn.y*T-T*1.15,Math.max(12,T*.3),'#1B2040','#fff');
  ctx.restore();
}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw(t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
setInterval(()=>{if(started)save()},4000);

/* ───────── 시작 ───────── */
hud();
if(S.prog>0||S.c0>0) $('#bStart').textContent='이어하기';
$('#bStart').onclick=()=>{$('#title').hidden=true;started=true;cvs.focus()};
cvs.addEventListener('pointerdown',()=>cvs.focus());
})();
